version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: jansetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jansetu
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jansetu"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Python FastAPI AI Engine
  ai-engine:
    build:
      context: ./JanSetu/Ai-Engine-main
      dockerfile: Dockerfile
    container_name: jansetu-ai-engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 3. Node.js Express Backend API Gateway
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: jansetu-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/jansetu
      - JWT_SECRET=jansetu_jwt_super_secret_key_2026_jharkhand
      - AI_ENGINE_URL=http://ai-engine:8000
      - CORS_ORIGIN=http://localhost:5173,http://localhost:80,http://localhost:3000
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 4. React Vite Frontend (Nginx)
  frontend:
    build:
      context: ./JanSetu
      dockerfile: Dockerfile
    container_name: jansetu-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_AI_ENGINE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
